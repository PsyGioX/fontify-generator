version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer: <6.1.0).
      # Remove this rule once typescript-eslint announces TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep Node typings aligned with the Node 22 runtime used in CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
